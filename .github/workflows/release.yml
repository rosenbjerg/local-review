name: release

# `release` only ever moves by a fast-forward from main, so a push here is a
# deliberate "ship what main has now". No path filter: whoever pushed meant it.
on:
  push:
    branches: [release]

# Releases are v<MAJOR_MINOR>.<patch>; the patch is derived from the tags at
# release time. Bump this to start a new minor or major at .0.
env:
  MAJOR_MINOR: "1.0"

# Needed to create tags/releases and upload assets.
permissions:
  contents: write

# Don't let overlapping pushes race on the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls full history + tags so the changelog step can
      # diff against the previous release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One past the highest existing v<MAJOR_MINOR>.* tag, so the sequence has
      # no gaps and doesn't depend on how many times the workflow has run.
      - name: Next version
        id: version
        run: |
          prefix="v${MAJOR_MINOR}."
          last=$(git tag --list "${prefix}*" --sort=-v:refname | head -n1)
          if [ -n "$last" ]; then
            patch=$(( ${last#"$prefix"} + 1 ))
          else
            patch=0
          fi
          echo "tag=${prefix}${patch}" >> "$GITHUB_OUTPUT"
          echo "next release: ${prefix}${patch} (previous: ${last:-none})"

      # Build the frontend once — web/dist is platform-agnostic and embedded
      # into every binary via go:embed.
      - uses: oven-sh/setup-bun@v2
        with:
          # The version web/bun.lock was written by.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: web
      # Gate the release on the frontend suite too — a failing vitest run must
      # never tag or publish, same as the Go test gate below.
      - name: Frontend tests
        run: bun run test
        working-directory: web
      - run: bun run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Gate the release on the test suite — a failing test must never tag or
      # publish. Runs after the frontend build so the go:embed of web/dist
      # (pulled in by the root package) compiles. The package list excludes
      # web/node_modules, where an ESLint dependency vendors a Go package of
      # its own.
      - name: Test
        run: go test $(go list ./... | grep -v '/web/node_modules/')

      # Pure-Go build (modernc.org/sqlite needs no cgo), so all targets
      # cross-compile from this one Linux runner.
      - name: Build binaries
        run: |
          mkdir -p out
          build() {
            echo "building $3"
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 \
              go build -trimpath -ldflags="-s -w" -o "out/$3" .
          }
          build darwin  arm64 local-review-darwin-arm64
          build darwin  amd64 local-review-darwin-amd64
          build linux   amd64 local-review-linux-amd64
          build linux   arm64 local-review-linux-arm64
          build windows amd64 local-review-windows-amd64.exe

      # Release notes are the commit titles since the previous release tag.
      - name: Build changelog
        run: |
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            range="$prev_tag..HEAD"
            echo "changelog since $prev_tag"
          else
            range=""
            echo "no previous tag; using full history"
          fi
          # Keep only commits that touched the application, so doc/config
          # commits don't appear.
          commits=$(git log --no-merges --pretty=format:'- %s' $range \
            -- main.go internal go.mod go.sum web)
          {
            echo "## Changes"
            echo
            if [ -n "$commits" ]; then echo "$commits"; else echo "- No changes"; fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: out/*
