name: ci

# Verify every pull request into main, and main itself after merge, so a
# broken build, failing test, or unformatted code never lands.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend first: `bun run build` runs tsc (typecheck) and vite, producing
      # web/dist — which the root Go package embeds via go:embed, so every Go
      # step below needs it present to compile. There is no Node step: bun runs
      # vite/vitest/tsc/eslint on its own runtime (web/bunfig.toml).
      - uses: oven-sh/setup-bun@v2
        with:
          # The version web/bun.lock was written by.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: web
      # Frontend unit tests (vitest) — independent of the build, so run first
      # for a fast, targeted signal on the useReview/annotate/commentRef logic.
      - name: frontend tests
        run: bun run test
        working-directory: web
      - run: bun run build
        working-directory: web
      # web/src/fontFeatures.ts is read out of the bundled woff2 files. A font
      # upgrade that renumbers a stylistic set would otherwise leave the app
      # applying a tag under the wrong name.
      - name: generated font features are current
        run: bun scripts/fontfeatures.ts --check

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `./...` walks web/node_modules, where an ESLint dependency (flatted)
      # vendors a Go package of its own. Checking a dependency's Go file is
      # wasted work, and it puts someone else's formatting in the path of our
      # gofmt gate — a dependency bump could fail CI for a file we don't own.
      # Resolve the package list once, minus that tree, and let every Go step
      # below use it.
      - name: go package list
        run: echo "GOPKGS=$(go list ./... | grep -v '/web/node_modules/' | tr '\n' ' ')" >> "$GITHUB_ENV"

      # Tracked files only, for the same reason — and it's exactly the set we own.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet $GOPKGS

      - name: go build
        run: go build $GOPKGS

      # -race needs cgo (default-on for this native build) and catches data
      # races in the SSE hub and store under concurrent access.
      - name: go test
        run: go test -race $GOPKGS
